<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="%BASE_URL%favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index, follow" />
    <meta
      name="description"
      content="Olanco is a family-run joinery workshop crafting solid timber doors, windows, handrailing, pantry cupboards and custom wooden furniture to measure."
    />
    <meta
      name="keywords"
      content="wooden doors, wooden windows, handrailing, pantry cupboards, custom wooden furniture, joinery workshop Colombo, timber furniture Sri Lanka"
    />
    <meta name="theme-color" content="#6b4128" />
    <title>Olanco &mdash; Doors, Windows &amp; Fine Joinery</title>
    <style>
      /* Critical loading-screen CSS, inlined so it paints before the app bundle loads. */
      #app-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        background: #fbf4e9;
        z-index: 9999;
      }
      html.dark #app-loader {
        background: #34211a;
      }
      #app-loader .mark {
        width: 44px;
        height: 44px;
        border-radius: 10px;
        background: #6b4128;
        color: #fefcf8;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Georgia, serif;
        font-weight: 700;
        font-size: 1.25rem;
        animation: app-loader-pulse 1.1s ease-in-out infinite;
      }
      #app-loader .label {
        font:
          500 0.8rem/1 system-ui,
          sans-serif;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #6b4128;
        opacity: 0.7;
      }
      html.dark #app-loader .label {
        color: #faf3e6;
      }
      @keyframes app-loader-pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(0.88);
          opacity: 0.7;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-loader .mark {
          animation: none;
        }
      }
    </style>
    <script>
      // Apply the saved/system theme before first paint to avoid a light/dark flash,
      // and keep the inline loader above in sync with it.
      (function () {
        try {
          var stored = localStorage.getItem('olanco-theme');
          var dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {
          // localStorage unavailable (private browsing, blocked) — fall back to light.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!--
        Shown until React mounts and replaces this markup — no JS coordination
        needed, since React's render() replaces the container's children.
      -->
      <div id="app-loader" role="status" aria-label="Loading Olanco">
        <div class="mark">O</div>
        <div class="label">Olanco</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
